name: CI — tests + typecheck + lint + e2e + visual

# Layer 7 of the tax-math verification stack (see docs/forecast-accuracy.md).
#
# Runs on every PR targeting main AND on every push to main. The goal is
# simple: a change that breaks the tax math, breaks TypeScript, or breaks
# lint can never reach production silently. Before this workflow existed
# the 125 vitest tests were local-only — someone had to remember to run
# `npm test` before pushing, and we caught one near-miss where a PR
# wouldn't have passed the suite if we had run it.
#
# What's gated (job fails) and what's reported (job continues):
# - vitest: HARD GATE. Catches regressions in `lib/tax/**` (IRS-published
#   examples, integration fixtures, property invariants). The whole
#   point of this workflow.
# - tsc --noEmit: HARD GATE. Catches type errors the IDE missed (we hit
#   one in the retirement-candidates literal-union widening this week).
# - eslint: NON-BLOCKING for now. The codebase has ~55 pre-existing lint
#   errors (mostly unescaped JSX apostrophes + a few prefer-const) that
#   long predate this workflow. Gating on lint immediately would block
#   every merge until that backlog is cleaned. Plan: clean up the lint
#   errors in a focused PR, then flip `continue-on-error` off here so
#   lint becomes a hard gate too. The non-blocking run still surfaces
#   the report on every PR so we don't accumulate MORE errors.
# - `next build`: not run here. Pulls Supabase env vars + secrets we
#   don't want to seed into CI. Vercel's preview deploy already runs
#   the build on every PR, so this CI doesn't need to duplicate it.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel an in-flight run if the same PR is updated. Prevents queue
# build-up when someone force-pushes corrections in quick succession.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-order:
    name: migration order guard
    runs-on: ubuntu-latest
    # A git diff and a directory listing, no npm install needed.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch origin/main
        # The guard needs origin/main's supabase/migrations as it stood
        # before this PR, not just the PR's own commits, and the default
        # checkout above only fetches the PR ref.
        run: git fetch origin main:refs/remotes/origin/main --depth=1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Guard against out-of-order and duplicate migration timestamps
        # A migration file that sorts before the newest one already on
        # origin/main gets silently skipped by `supabase db push`, or
        # forces --include-all and then replays out of order on the next
        # fresh environment. A duplicate timestamp means one of the two
        # files can never be recorded as applied and silently never runs.
        # Both hit this project three times in one night (2026-08-06/07);
        # see docs/migration-history-state.md and
        # scripts/check-migration-order.mjs for the specifics. This check
        # needs no database credentials: it compares against origin/main,
        # not production.
        run: node scripts/check-migration-order.mjs

  definer-grants:
    name: definer grant guard
    runs-on: ubuntu-latest
    # A git diff and a file read, no npm install and no database.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch origin/main
        # Same reason as the migration-order job: the guard needs to know
        # which migrations are NEW in this PR, and the default checkout
        # only fetches the PR ref.
        run: git fetch origin main:refs/remotes/origin/main --depth=1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Guard against new anon-executable SECURITY DEFINER functions
        # Postgres grants EXECUTE on a new function to PUBLIC by default,
        # PostgREST exposes public functions at /rest/v1/rpc/, and Supabase's
        # `anon` role inherits PUBLIC. So a SECURITY DEFINER function is
        # internet-facing from the moment it is created, running with the
        # definer's privileges, unless the migration explicitly revokes.
        #
        # Five findings in this project were exactly that, closed one at a
        # time: mileage_broken_trips (cross-tenant trip data to anyone),
        # purge_expired_recycle_bin (unauthenticated destructive action),
        # passkey_lookup_by_email (identity oracle), and lookup_w9_request /
        # submit_w9_form (a plaintext TIN writable through PostgREST).
        #
        # Runs in PR mode ON PURPOSE, checking only migrations new since
        # origin/main. It does NOT retroactively fail the ~85 historical
        # definitions that predate this guard; that backlog is tracked
        # separately. The job's job is to stop the number growing.
        run: node scripts/check-definer-grants.mjs

  ios-compile:
    name: ios compiles
    runs-on: macos-15
    timeout-minutes: 30
    # The iOS half of this app was compiled for the FIRST time by the
    # release workflow, on the way to the App Store. Android got its own
    # compile gate; iOS did not, and the asymmetry has cost real money.
    #
    # A .swift file that is not registered in project.pbxproj compiles to
    # NOTHING and fails silently at runtime. That has shipped here twice:
    # TaxotticDeviceStatusPlugin was dead for weeks, and the geofence
    # bridge that iOS needs to arm its region mesh was never written at
    # all, which nobody noticed until a driver's device reported
    # geofence_count = null with four places waiting server-side.
    #
    # Compile only: no signing, no keystore, no App Store credentials,
    # nothing that could publish. It answers the one question that was
    # going unasked, does this Swift build, in about a minute.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Apple's toolchain moves fast and the runner carries several. Pick
      # the newest 26.x, matching ios-release.yml, so a file that builds
      # here builds there.
      - name: Select Xcode 26
        run: |
          for v in 26.1 26.0 26; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_${v}.app"
              xcodebuild -version
              exit 0
            fi
          done
          echo "Xcode 26 not found; available:"
          ls /Applications | grep Xcode
          exit 1

      - run: npm ci

      # Same reason as the Android job: the native project references
      # generated Capacitor scaffolding that is gitignored, so a fresh
      # checkout cannot build without this. `sync` (copy + update), not
      # `update`, for the reason recorded in that job.
      - name: Generate Capacitor native scaffolding
        run: npx cap sync ios

      # Simulator destination and signing disabled: this gate must run on
      # every PR from any fork, so it can never need a certificate.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

  android-compile:
    name: android compiles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Until now the Android sources were compiled for the FIRST time by
    # the release workflow, on the way to Google Play. So a native change
    # that does not compile was discovered at the moment of shipping, by
    # the one workflow whose failure is most expensive, and only if
    # somebody happened to be cutting a release.
    #
    # The web half of this app is checked on every PR while the native
    # half was checked at release. That asymmetry is not defensible for a
    # mileage tracker whose hardest bugs (process death, foreground
    # services, geofence wakes) live entirely in the native half.
    #
    # Compile only: no signing, no keystore, no Play credentials, nothing
    # that could publish. It answers one question, does this Java build,
    # which is the question that was going unasked.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor's Android toolchain targets 21. A local JDK 17 fails
          # with "invalid source release: 21" before compiling a line,
          # which is exactly how this gap stayed invisible.
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Needed for the Capacitor gradle modules under node_modules, which
      # the android project includes by relative path.
      - run: npm ci

      # android/capacitor-cordova-android-plugins is GENERATED and
      # gitignored, and android/build.gradle reads
      # cordova.variables.gradle from it, so a fresh checkout cannot
      # evaluate the build script at all without this. The first run of
      # this job proved it, failing with:
      #
      #   Could not read script '.../cordova.variables.gradle' as it
      #   does not exist
      #
      # `sync` and not `update`, learned the hard way one run apart.
      # TWO artifacts are generated and gitignored, not one:
      #   android/capacitor-cordova-android-plugins/    (needs update)
      #   android/app/src/main/assets/capacitor.plugins.json (needs copy)
      # `update` alone dies on the second with ENOENT. sync is copy +
      # update, which is why the release workflow has always used it.
      # Verified by deleting both locally and re-running: 0.11s.
      - name: Generate Capacitor native scaffolding
        run: npx cap sync android

      - name: Compile Android sources
        working-directory: android
        run: ./gradlew :app:compileDebugJavaWithJavac --no-daemon

  verify:
    name: tests + typecheck + lint
    runs-on: ubuntu-latest
    # Local runs are ~600ms for tests + ~30s for tsc. Cold install on a
    # GH runner is the long pole; 10 min is a safe ceiling.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches package.json engines.node ">=20.10.0". 20.x gets the
          # built-in fetch polyfill behavior we rely on in tests.
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # `npm ci` is exact-version, faster than `npm install`, and fails
        # if package.json and package-lock.json drift — exactly what we
        # want on CI.
        run: npm ci

      - name: Run tax-math tests (vitest)
        # All 125 tests live next to the code they verify (lib/tax/**).
        # Layers 1-3 of the verification stack: IRS-published worked
        # examples, integration fixtures, property-based invariants.
        run: npm test

      - name: TypeScript check
        # `tsc --noEmit` runs the full project type-check without writing
        # output. Catches the things the IDE missed — last week a literal
        # union got widened by .filter() and tsc was the only signal.
        run: npm run typecheck

      - name: ESLint (report-only)
        # Non-blocking until the existing ~55-error backlog is cleaned.
        # `continue-on-error: true` lets the job pass with a yellow
        # warning indicator if lint fails, so the report is still
        # visible on every PR — we just don't block merges on it yet.
        # Flip this to false once the backlog is cleared.
        continue-on-error: true
        run: npm run lint

  e2e:
    name: e2e (Playwright — public surfaces)
    runs-on: ubuntu-latest
    # Browser download + `next dev` boot dominate; 15 min is a safe ceiling.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        # Both functional projects use Chromium; --with-deps pulls the Linux
        # system libraries the headless browser links against.
        run: npx playwright install --with-deps chromium

      - name: Run functional e2e
        # `npm run e2e` scopes to the chromium + mobile-chrome projects; the
        # visual-regression project is excluded (its baselines are macOS-
        # specific — regenerate on Linux to add VR here later).
        #
        # THIS is the gate that makes the sitemap-200 guard automatic — the
        # check that would have caught the /calculators + /compare
        # PUBLIC_PATHS regression before it shipped.
        #
        # Every functional spec runs UNAUTHENTICATED by design: public pages
        # return 200, auth-gated routes redirect to /login, cron routes 401
        # without an Authorization header. None query Supabase for content,
        # so dummy connection env is enough to boot the app (verified: with
        # only these values, public pages serve 200 and /firm/* 307s to
        # /login). These are NOT secrets — no real connection is ever made.
        run: npm run e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-dummy-anon-not-a-secret"
          SUPABASE_SERVICE_ROLE_KEY: "ci-dummy-service-role-not-a-secret"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual:
    name: visual regression (public surfaces)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Compare against Linux baselines
        # Compares the public pages against the committed *-linux.png
        # baselines (produced by the visual-baselines job on this same
        # ubuntu image). A layout/style regression fails here with a pixel
        # diff — the automated catch for the UI polish escapes the audit
        # flagged. Same dummy Supabase env as the e2e job (public pages only).
        run: npm run e2e:visual
        env:
          NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-dummy-anon-not-a-secret"
          SUPABASE_SERVICE_ROLE_KEY: "ci-dummy-service-role-not-a-secret"

      - name: Upload diff report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-report
          path: playwright-report/
          retention-days: 7

  ct:
    name: component visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Compare components against Linux baselines
        # Renders the isolated component harness (its own Vite server — no
        # app server, no Supabase) and diffs against the committed
        # *-ct-*-linux.png baselines. Catches component-level layout/style
        # regressions (e.g. the mobile select overflow). Regenerate the
        # Linux baselines via the visual-baselines job when the UI changes.
        run: npm run test:ct

      - name: Upload diff report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ct-diff-report
          path: playwright-report/
          retention-days: 7

  visual-baselines:
    # Manual only (Actions → this workflow → "Run workflow"). Regenerates
    # the LINUX visual-regression baselines the `visual` job compares
    # against. Screenshot baselines are OS/font-rendering specific, so they
    # must be produced on the same ubuntu image CI runs on — never on a
    # dev's Mac. Download the "visual-baselines-linux" artifact this
    # produces and commit the *-linux.png files. Re-run whenever the UI
    # intentionally changes (or the runner image bumps and rendering shifts).
    name: visual baselines (manual — regenerate Linux snapshots)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Regenerate page-VR baselines
        # The npm script passes `--update-snapshots=all` for a reason worth
        # not rediscovering: bare `--update-snapshots` means Playwright's
        # `changed` preset, which rewrites a baseline ONLY when the fresh
        # render fails the comparison. Anything the comparator considers a
        # match keeps its OLD file, so one regeneration run can emit a set
        # that is half new design and half previous design, and report
        # success. That happened on the Instrument skin: the ground moved
        # from cream to cool paper, a change smaller than pixelmatch's
        # default per-pixel threshold, so pricing and calculators-hub kept
        # cream baselines while home was rewritten. Guarded by
        # lib/visual/baseline-regeneration.test.ts.
        run: npm run e2e:visual:update
        env:
          NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-dummy-anon-not-a-secret"
          SUPABASE_SERVICE_ROLE_KEY: "ci-dummy-service-role-not-a-secret"

      - name: Regenerate component-VR baselines
        # Component tests render in an isolated Vite harness — no app server,
        # no Supabase — so no env is needed.
        run: npm run test:ct:update

      - name: Upload Linux baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: |
            e2e/visual.spec.ts-snapshots/*-linux.png
            __ct-snapshots__/**/*-linux.png
          if-no-files-found: error
          retention-days: 7
