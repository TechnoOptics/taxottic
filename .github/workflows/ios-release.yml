name: iOS — TestFlight

# Builds the iOS archive on a macOS runner using AUTOMATIC signing
# with an App Store Connect API key, then uploads to TestFlight.
#
# Automatic signing means we do NOT need to:
#   - Generate a Certificate Signing Request from a Mac's Keychain
#   - Export a .p12 (which physically requires macOS)
#   - Manually create / download a .mobileprovision
#
# Xcode handles all of that on the fly each build, talking to App
# Store Connect with the API key. The user only needs the four
# secrets below — all obtainable from any browser.
#
# REQUIRED REPO SECRETS (set under Settings → Secrets → Actions):
#
#   IOS_TEAM_ID       10-char Apple team ID
#                       Where: developer.apple.com → Membership → Team ID
#                       (top of the Membership Details panel)
#   ASC_KEY_ID        App Store Connect API Key ID (e.g. ABC123XYZ)
#                       Where: appstoreconnect.apple.com →
#                       Users and Access → Keys → "+"
#                       Choose "Admin" role. Download the .p8 once.
#                       The Key ID appears in the Keys list.
#   ASC_ISSUER_ID     App Store Connect Issuer ID (UUID)
#                       Where: top of the same Keys page,
#                       right above the Keys table.
#   ASC_PRIVATE_KEY   Contents of AuthKey_<KEY_ID>.p8 (paste raw text
#                       including the -----BEGIN PRIVATE KEY----- header)
#
# Setup time: ~5 minutes through the web UI. No Mac required.

on:
  workflow_dispatch:
    inputs:
      build-notes:
        description: "TestFlight build notes (shown to internal testers)"
        required: false
        default: "Automated build from main"

jobs:
  ios-archive:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Capacitor sync copies the latest web assets (none in our case
      # — server.url is live) and refreshes plugin native code.
      - run: npx cap sync ios

      # Save ASC API key to the standard private_keys location;
      # xcodebuild + altool both look here automatically.
      - name: Save ASC API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          KEY_FILE=~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          printf "%s" "$ASC_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

      - name: Bump build number
        working-directory: ios/App
        run: |
          # Use github.run_number so each build is monotonic + unique.
          /usr/libexec/PlistBuddy -c "Set CFBundleVersion ${{ github.run_number }}" App/Info.plist

      # Pin the bundle id + team id in the Xcode project so the
      # automatic-signing flow knows which provisioning profile to
      # generate. xcodebuild's -allowProvisioningUpdates flag lets it
      # create / fetch profiles via the ASC API key on the fly.
      - name: Archive (automatic signing)
        working-directory: ios/App
        run: |
          # Tee to a log file so we can dump raw output on failure —
          # xcpretty's default error filter sometimes hides the
          # actual reason an archive fails.
          set -o pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            DEVELOPMENT_TEAM=${{ secrets.IOS_TEAM_ID }} \
            CODE_SIGN_STYLE=Automatic \
            archive 2>&1 | tee $RUNNER_TEMP/archive.log | xcpretty || {
              echo "::group::Raw xcodebuild output (last 200 lines)"
              tail -200 $RUNNER_TEMP/archive.log
              echo "::endgroup::"
              exit 1
            }

      - name: Write export options
        run: |
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} | xcpretty

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            -f $RUNNER_TEMP/export/App.ipa \
            -t ios \
            --apiKey ${{ secrets.ASC_KEY_ID }} \
            --apiIssuer ${{ secrets.ASC_ISSUER_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/App.ipa
          retention-days: 14
