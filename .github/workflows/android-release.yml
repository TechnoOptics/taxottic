name: Android — Play Internal Track

# Builds a signed Android App Bundle (.aab) and uploads it to the
# Internal Testing track on Google Play. Promote to Closed/Open
# Testing or Production from the Play Console UI once you've
# smoke-tested.
#
# REQUIRED REPO SECRETS:
#
#   ANDROID_KEYSTORE         Base64'd .jks keystore file
#   ANDROID_KEYSTORE_PWD     Keystore password
#   ANDROID_KEY_ALIAS        Key alias (e.g. "taxottic-upload")
#   ANDROID_KEY_PWD          Key password (often same as KEYSTORE_PWD)
#   PLAY_SERVICE_ACCOUNT     Full JSON of the Play Console service-account
#                            with "Release manager" role on the app.
#                            Generate at console.cloud.google.com IAM,
#                            then invite into Play Console → Users.
#
# Generate the keystore once:
#   keytool -genkey -v -keystore taxottic.jks -keyalg RSA -keysize 4096 \
#     -validity 25000 -alias taxottic-upload
#   base64 -i taxottic.jks | pbcopy
#
# Apply for "Play App Signing" on first upload (Play console asks)
# so Google holds the actual release key and our keystore is just an
# upload key — recoverable if lost.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track (internal | alpha | beta | production)"
        required: false
        default: "internal"

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # Regenerate the launcher icon + splash from the navy brand
      # SVGs (assets/*.svg) so a rebrand never leaves stale-colour
      # raster icons in the binary. Non-fatal: icons are cosmetic and
      # must never block shipping the fixes a release carries — a
      # generator hiccup just keeps the committed icons.
      - name: Regenerate brand assets (navy)
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#121A2A' \
            --iconBackgroundColorDark '#121A2A' \
            --splashBackgroundColor '#121A2A' \
            --splashBackgroundColorDark '#121A2A' \
          || echo "::warning::asset regeneration skipped — shipping committed icons"

      # Android push is gated on Firebase. The @capacitor/push-
      # notifications plugin pulls firebase-messaging; with no
      # google-services.json the FirebaseApp never initializes and the
      # app HARD-CRASHES on launch ("Default FirebaseApp is not
      # initialized"). So this is safe-by-default and self-enabling:
      #
      #   - GOOGLE_SERVICES_JSON secret SET  → write
      #     android/app/google-services.json (android/app/build.gradle
      #     already conditionally applies com.google.gms.google-services
      #     when that file exists, and the classpath is in
      #     android/build.gradle) and KEEP the plugin → Android push
      #     works.
      #   - secret ABSENT → strip the plugin from node_modules so
      #     `cap sync android` doesn't add it; isPluginAvailable(
      #     "PushNotifications") is false and CapacitorNativeInit
      #     cleanly no-ops (no crash).
      #
      # No workflow edit is needed to turn Android push on — just add
      # the GOOGLE_SERVICES_JSON repo secret (see
      # docs/MANUAL_KEYS_RUNBOOK.md → Push notifications).
      - name: Configure Firebase or strip push (safe-by-default)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON present → enabling Android push"
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            # Accept base64-encoded secrets too (a common way to store
            # JSON secrets safely): if the raw value isn't JSON, try
            # decoding before failing.
            if ! node -e "JSON.parse(require('fs').readFileSync('./android/app/google-services.json','utf8'))" 2>/dev/null; then
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json 2>/dev/null || true
            fi
            # Sanity-check it is valid JSON with a project_id so a
            # malformed secret fails the build loudly instead of
            # shipping a broken (crashing) push binary.
            node -e "const j=require('./android/app/google-services.json');if(!j.project_info&&!j.project_id){process.exit(1)}" \
              || { echo '::error::GOOGLE_SERVICES_JSON is not a valid google-services.json (raw or base64). Re-save the secret with the FILE CONTENTS from Firebase console → Project settings → your Android app.'; exit 1; }
          else
            echo "GOOGLE_SERVICES_JSON absent → stripping push-notifications (no Firebase yet)"
            rm -rf node_modules/@capacitor/push-notifications
          fi

      - run: npx cap sync android

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/taxottic.jks
          echo "STORE_FILE=$RUNNER_TEMP/taxottic.jks" >> $GITHUB_ENV

      - name: Bump versionCode (phone + watch)
        working-directory: android
        run: |
          # github.run_number is monotonic per workflow — perfect
          # versionCode source. android.defaultConfig.versionCode in
          # build.gradle gets replaced with this value.
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          # The Wear bundle ships in the SAME Play app (com.taxottic.app)
          # and Play requires every bundle in an app to have a UNIQUE
          # versionCode. Give the watch a disjoint, still-monotonic
          # range (run_number + 2,000,000) so phone and watch codes can
          # never collide and the watch code always increases. Play
          # delivers the right bundle by form factor (the Wear manifest
          # declares uses-feature android.hardware.type.watch +
          # com.google.android.wearable.standalone), so the codes only
          # need to be unique, not ordered against each other.
          # Kotlin DSL: `versionCode = N` (note the spaces around `=`).
          WEAR_VC=$(( ${{ github.run_number }} + 2000000 ))
          sed -i "s/versionCode = [0-9]*/versionCode = ${WEAR_VC}/" ../wear/build.gradle.kts

      - name: Build signed AABs (phone + watch)
        working-directory: android
        env:
          STORE_PWD: ${{ secrets.ANDROID_KEYSTORE_PWD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.ANDROID_KEY_PWD }}
        run: |
          # gradlew was committed from a Windows machine where the
          # filesystem has no Unix execute bit. We've since fixed
          # the bit in git via update-index --chmod=+x, but this is
          # cheap defense-in-depth in case it ever drifts again.
          chmod +x ./gradlew
          # Explicit targets (was bare `bundleRelease`): build BOTH the
          # Capacitor phone bundle and the standalone Wear OS bundle.
          # The injected signing props apply to every module's release
          # variant, so the watch AAB is signed with the same upload
          # key. :app does not depend on :wear — they build independently.
          ./gradlew :app:bundleRelease :wear:bundleRelease \
            -Pandroid.injected.signing.store.file=$STORE_FILE \
            -Pandroid.injected.signing.store.password=$STORE_PWD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PWD

      # PHONE bundle only goes to Play. The phone-only release path is
      # proven (16+ green runs). Co-releasing the Wear AAB in the same
      # edit makes Play's API return "Internal error encountered" until
      # a ONE-TIME, non-automatable Play Console step is done: the app
      # must be explicitly opted into Wear OS distribution (Advanced
      # settings → Form factors → Wear OS). Until that's done, bundling
      # the watch AAB here blocks the phone release that testers need.
      # So: ship the phone AAB now; the watch AAB is still built and
      # kept as a CI artifact (downloadable below) for sideload / for
      # the Play Wear upload once the console opt-in is complete. See
      # docs/MOBILE_APP_STORE_RUNBOOK.md. The internal-testing tester
      # list (adding tester Google accounts) is also Console-only.
      - name: Upload to Play (phone — internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          packageName: com.taxottic.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
          changesNotSentForReview: false

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            wear/build/outputs/bundle/release/wear-release.aab
          retention-days: 14
