name: iOS — Distribute build to TestFlight internal testers

# Puts the latest processed TestFlight build in front of your
# INTERNAL testers (no Apple Beta App Review) using the App Store
# Connect API. Same credential model as the upload workflow: the
# ASC_* secrets are injected by GitHub into the runner — they are
# never printed and never leave Apple's API surface.
#
# What it does, in order:
#   1. Mint an ES256 App Store Connect API JWT from ASC_PRIVATE_KEY
#   2. Resolve the app by bundle id com.taxottic.app (authoritative —
#      ignores the store display name, so "Advottic" vs "Taxottic"
#      can't send us to the wrong record)
#   3. Find the most recent build whose processingState is VALID
#   4. Ensure a beta group named via the `group_name` input exists.
#      Tries to create it as an INTERNAL group; if Apple's API
#      rejects internal-group creation (varies by account), falls
#      back to the always-present default internal group so the
#      outcome is the same: internal/team users get the build with
#      ZERO review.
#   5. Link the build to that group
#   6. Optionally add tester emails (only succeeds for people who
#      are already Users on your App Store Connect team — that's an
#      Apple rule for internal testing, not ours). Per-email errors
#      are reported, not fatal.
#
# REQUIRED SECRETS (already set on this repo):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY
#
# This NEVER submits anything for public review. Internal TestFlight
# distribution needs no Apple review and no legal attestations.

on:
  workflow_dispatch:
    inputs:
      group_name:
        description: "TestFlight internal group name"
        required: true
        default: "Techno Testers"
      bundle_id:
        description: "App bundle identifier"
        required: true
        default: "com.taxottic.app"
      tester_emails:
        description: "Comma-separated emails (must be App Store Connect team users for internal testing). Leave blank to skip."
        required: false
        default: ""

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Distribute to internal testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          GROUP_NAME: ${{ inputs.group_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          TESTER_EMAILS: ${{ inputs.tester_emails }}
        run: |
          cat > /tmp/distribute.mjs <<'SCRIPT'
          import crypto from "node:crypto";

          const KEY_ID = process.env.ASC_KEY_ID;
          const ISSUER = process.env.ASC_ISSUER_ID;
          const PRIVATE_KEY = process.env.ASC_PRIVATE_KEY;
          const GROUP_NAME = process.env.GROUP_NAME || "Techno Testers";
          const BUNDLE_ID = process.env.BUNDLE_ID || "com.taxottic.app";
          const EMAILS = (process.env.TESTER_EMAILS || "")
            .split(",").map(s => s.trim()).filter(Boolean);

          // ES256 App Store Connect JWT using Node's built-in crypto —
          // no npm dependency (the prior jsonwebtoken approach failed
          // module resolution because there's no checkout/node_modules
          // adjacent to the /tmp script). `dsaEncoding: ieee-p1363`
          // yields the raw r||s signature JOSE/JWT requires; without
          // it Node emits DER and Apple rejects the token.
          const b64url = (b) =>
            Buffer.from(b).toString("base64")
              .replace(/=/g, "").replace(/\+/g, "-").replace(/\//g, "_");
          const now = Math.floor(Date.now() / 1000);
          const header = { alg: "ES256", kid: KEY_ID, typ: "JWT" };
          const payload = {
            iss: ISSUER, iat: now, exp: now + 60 * 15,
            aud: "appstoreconnect-v1",
          };
          const signingInput =
            b64url(JSON.stringify(header)) + "." + b64url(JSON.stringify(payload));
          const sig = crypto.sign("sha256", Buffer.from(signingInput), {
            key: PRIVATE_KEY, dsaEncoding: "ieee-p1363",
          });
          const token = signingInput + "." +
            sig.toString("base64")
              .replace(/=/g, "").replace(/\+/g, "-").replace(/\//g, "_");
          const API = "https://api.appstoreconnect.apple.com/v1";
          const H = { Authorization: `Bearer ${token}`, "Content-Type": "application/json" };

          async function api(path, opts = {}) {
            const res = await fetch(path.startsWith("http") ? path : API + path, {
              ...opts, headers: { ...H, ...(opts.headers || {}) },
            });
            const text = await res.text();
            let body; try { body = text ? JSON.parse(text) : {}; } catch { body = { raw: text }; }
            if (!res.ok) {
              throw new Error(`${res.status} ${path}\n${JSON.stringify(body, null, 2)}`);
            }
            return body;
          }

          // 1. App by bundle id (authoritative — not the display name).
          const apps = await api(`/apps?filter[bundleId]=${encodeURIComponent(BUNDLE_ID)}`);
          if (!apps.data?.length) throw new Error(`No app with bundle id ${BUNDLE_ID}`);
          const app = apps.data[0];
          console.log(`App: ${app.attributes.name} (${app.id}) bundle=${BUNDLE_ID}`);

          // 2. Latest VALID build.
          const builds = await api(
            `/builds?filter[app]=${app.id}&sort=-version&limit=10&include=preReleaseVersion`
          );
          const valid = builds.data.find(b => b.attributes.processingState === "VALID")
            || builds.data[0];
          if (!valid) throw new Error("No builds found for this app");
          console.log(`Build: ${valid.id} version=${valid.attributes.version} state=${valid.attributes.processingState}`);
          if (valid.attributes.processingState !== "VALID") {
            console.log(`::warning::Latest build is ${valid.attributes.processingState}, not VALID yet. ` +
              `If this fails to link, re-run once Apple finishes processing.`);
          }

          // 3. Ensure the beta group exists.
          const groups = await api(
            `/betaGroups?filter[app]=${app.id}&filter[name]=${encodeURIComponent(GROUP_NAME)}&limit=1`
          );
          let group = groups.data[0];
          if (group) {
            console.log(`Reusing existing group "${GROUP_NAME}" (${group.id}, internal=${group.attributes.isInternalGroup})`);
          } else {
            try {
              const created = await api(`/betaGroups`, {
                method: "POST",
                body: JSON.stringify({
                  data: {
                    type: "betaGroups",
                    attributes: { name: GROUP_NAME, isInternalGroup: true },
                    relationships: { app: { data: { type: "apps", id: app.id } } },
                  },
                }),
              });
              group = created.data;
              console.log(`Created internal group "${GROUP_NAME}" (${group.id})`);
            } catch (e) {
              console.log(`::warning::Could not create a custom internal group ` +
                `(Apple restricts this on some accounts). Falling back to the ` +
                `default internal group. Same outcome: team users get the build, no review.`);
              console.log(String(e.message).split("\n")[0]);
              const internal = await api(
                `/betaGroups?filter[app]=${app.id}&filter[isInternalGroup]=true&limit=1`
              );
              group = internal.data[0];
              if (!group) throw new Error(
                "No internal group exists and one could not be created. " +
                "Create an internal group once in App Store Connect; re-runs will then be hands-off."
              );
              console.log(`Using default internal group ${group.id}`);
            }
          }

          // 4. Link the build to the group (idempotent — ignore "already linked").
          try {
            await api(`/betaGroups/${group.id}/relationships/builds`, {
              method: "POST",
              body: JSON.stringify({ data: [{ type: "builds", id: valid.id }] }),
            });
            console.log(`Linked build ${valid.id} -> group ${group.id}`);
          } catch (e) {
            if (/already/i.test(e.message)) console.log("Build already linked to group.");
            else throw e;
          }

          // 5. Optional testers (internal => must be team users).
          let added = 0, skipped = [];
          for (const email of EMAILS) {
            try {
              await api(`/betaTesters`, {
                method: "POST",
                body: JSON.stringify({
                  data: {
                    type: "betaTesters",
                    attributes: { email },
                    relationships: { betaGroups: { data: [{ type: "betaGroups", id: group.id }] } },
                  },
                }),
              });
              added++;
              console.log(`Added tester ${email}`);
            } catch (e) {
              skipped.push(email);
              console.log(`::warning::Could not add ${email} (for internal testing they must ` +
                `already be a User in App Store Connect): ${String(e.message).split("\n")[0]}`);
            }
          }

          console.log("\n=== RESULT ===");
          console.log(`App:   ${app.attributes.name} / ${BUNDLE_ID}`);
          console.log(`Build: v${valid.attributes.version} (${valid.id})`);
          console.log(`Group: ${GROUP_NAME} (${group.id})`);
          console.log(`Testers added: ${added}${skipped.length ? `, skipped: ${skipped.join(", ")}` : ""}`);
          console.log("Internal testers can now install via the TestFlight app. No review was required.");
          SCRIPT
          node /tmp/distribute.mjs
