name: iOS — TestFlight external invite

# Invites external testers by email. External testers are NOT App Store
# Connect team members — no account access is granted — so this is the
# lane that works without adding anyone to the Apple team (the internal
# lane 409s unless the tester is a team user). The named build is
# attached to an external group and submitted for Beta App Review once;
# testers get their invite email immediately and the build unlocks for
# them the moment beta review clears.

on:
  workflow_dispatch:
    inputs:
      emails:
        description: "Comma-separated tester emails"
        required: true
      first_names:
        description: "Comma-separated first names (parallel to emails)"
        required: false
        default: ""
      build_number:
        description: "CFBundleVersion to distribute (e.g. 28)"
        required: true
      contact_phone:
        description: "Real phone for Beta App Review contact (needed once; Apple may call it)"
        required: false
        default: ""

jobs:
  invite:
    runs-on: ubuntu-latest
    steps:
      - name: Invite external testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          EMAILS: ${{ inputs.emails }}
          FIRST_NAMES: ${{ inputs.first_names }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          CONTACT_PHONE: ${{ inputs.contact_phone }}
        run: |
          cat > /tmp/invite.mjs <<'SCRIPT'
          import crypto from "node:crypto";
          const KID = process.env.ASC_KEY_ID, ISS = process.env.ASC_ISSUER_ID, PK = process.env.ASC_PRIVATE_KEY;
          const APP_ID = "6767039803";
          const GROUP_NAME = "External Testers";
          const emails = process.env.EMAILS.split(",").map((e) => e.trim()).filter(Boolean);
          const names = (process.env.FIRST_NAMES || "").split(",").map((n) => n.trim());
          const BUILD_NUMBER = process.env.BUILD_NUMBER.trim();
          if (!KID || !ISS || !PK) { console.error("::error::ASC_* secrets missing"); process.exit(1); }
          const b64u = (x) => Buffer.from(x).toString("base64url");
          const now = Math.floor(Date.now() / 1000);
          const head = b64u(JSON.stringify({ alg: "ES256", kid: KID, typ: "JWT" }));
          const body = b64u(JSON.stringify({ iss: ISS, iat: now, exp: now + 1200, aud: "appstoreconnect-v1" }));
          const sig = crypto.sign("sha256", Buffer.from(`${head}.${body}`), { key: PK, dsaEncoding: "ieee-p1363" }).toString("base64url");
          const TOK = `${head}.${body}.${sig}`;
          const api = async (method, path, payload, okCodes = []) => {
            const r = await fetch(`https://api.appstoreconnect.apple.com${path}`, {
              method, headers: { Authorization: `Bearer ${TOK}`, "Content-Type": "application/json" },
              body: payload ? JSON.stringify(payload) : undefined,
            });
            const t = await r.text();
            const o = t ? JSON.parse(t) : {};
            if (!r.ok && !okCodes.some((c) => t.includes(c))) {
              console.error(`::error::${method} ${path} -> ${r.status}: ${t.slice(0, 400)}`);
              process.exit(1);
            }
            return { status: r.status, body: o, raw: t };
          };

          // 1. Find the build by CFBundleVersion.
          const builds = await api("GET", `/v1/builds?filter[app]=${APP_ID}&filter[version]=${BUILD_NUMBER}&limit=5`);
          const build = (builds.body.data ?? [])[0];
          if (!build) { console.error(`::error::build ${BUILD_NUMBER} not found`); process.exit(1); }
          console.log(`Build ${BUILD_NUMBER}: ${build.id} (${build.attributes.processingState})`);

          // 2. Find or create the external group.
          const groups = await api("GET", `/v1/betaGroups?filter[app]=${APP_ID}&limit=50`);
          let group = (groups.body.data ?? []).find(
            (g) => g.attributes.isInternalGroup === false && g.attributes.name === GROUP_NAME,
          );
          if (!group) {
            const created = await api("POST", `/v1/betaGroups`, {
              data: { type: "betaGroups",
                attributes: { name: GROUP_NAME, isInternalGroup: false, publicLinkEnabled: false },
                relationships: { app: { data: { type: "apps", id: APP_ID } } } },
            });
            group = created.body.data;
            console.log(`Created external group "${GROUP_NAME}"`);
          } else {
            console.log(`Using existing group "${GROUP_NAME}"`);
          }

          // 3. Attach the build to the group (idempotent; ALREADY_EXISTS ok).
          await api("POST", `/v1/betaGroups/${group.id}/relationships/builds`, {
            data: [{ type: "builds", id: build.id }],
          }, ["ALREADY_EXISTS", "STATE_ERROR"]);
          console.log("Build attached to group");

          // 3.5 Beta metadata: Beta App Review refuses a build when the
          // app has no beta description / feedback email (422
          // MISSING_BETA_APP_DESCRIPTION — exactly what the first run
          // hit). Fill both idempotently before submitting.
          const locs = await api("GET", `/v1/apps/${APP_ID}/betaAppLocalizations`);
          const enLoc = (locs.body.data ?? []).find(
            (l) => (l.attributes.locale ?? "").startsWith("en"),
          );
          const BETA_DESC =
            "Taxottic tracks business mileage automatically and forecasts " +
            "self-employment taxes. This build improves drive-tracking " +
            "reliability: trips close about a minute after you park and walk " +
            "away, stops at lights no longer split drives, and miles are " +
            "priced at the correct IRS rate for the drive date. To test: sign " +
            "in, enable Log my drives automatically, take a short drive, park " +
            "and walk away, and confirm the trip appears with the right miles.";
          if (enLoc) {
            await api("PATCH", `/v1/betaAppLocalizations/${enLoc.id}`, {
              data: { type: "betaAppLocalizations", id: enLoc.id,
                attributes: { description: BETA_DESC, feedbackEmail: "contact@technooptics.com" } },
            });
            console.log("Beta description + feedback email set");
          } else {
            await api("POST", `/v1/betaAppLocalizations`, {
              data: { type: "betaAppLocalizations",
                attributes: { locale: "en-US", description: BETA_DESC, feedbackEmail: "contact@technooptics.com" },
                relationships: { app: { data: { type: "apps", id: APP_ID } } } },
            });
            console.log("Beta localization created (en-US)");
          }
          // Beta review contact details (required once per app).
          const detail = await api("GET", `/v1/apps/${APP_ID}/betaAppReviewDetail`);
          if (detail.body.data?.id) {
            // Fill only MISSING fields; never overwrite real data and never
            // invent a phone number — Apple may actually call it. If the
            // phone is absent, say so and continue: the submission error
            // (if any) names exactly what's still required.
            const a = detail.body.data.attributes ?? {};
            // Apple 409s ANY PATCH to this entity without contactPhone. A
            // real number arrives via the contact_phone input; we never
            // invent one. With no phone available the PATCH is skipped and
            // the submission's own error says whether Apple insists.
            const phone = a.contactPhone || process.env.CONTACT_PHONE || "";
            const attrs = {};
            if (!a.contactEmail) attrs.contactEmail = "contact@technooptics.com";
            if (!a.contactFirstName) attrs.contactFirstName = "Abel";
            if (!a.contactLastName) attrs.contactLastName = "Ark";
            if (Object.keys(attrs).length && phone) {
              attrs.contactPhone = phone;
              await api("PATCH", `/v1/betaAppReviewDetails/${detail.body.data.id}`, {
                data: { type: "betaAppReviewDetails", id: detail.body.data.id, attributes: attrs },
              });
              console.log(`Beta review contact updated: ${Object.keys(attrs).join(", ")}`);
            } else if (Object.keys(attrs).length) {
              console.log("Skipping contact PATCH: no phone on file and none provided (pass contact_phone).");
            } else {
              console.log("Beta review contact already complete");
            }
          }

          // 4. Invite each tester into the group (invite email sends now).
          //
          // ORDER IS LOAD-BEARING: testers MUST go in BEFORE the Beta App
          // Review submission below. Once a group's build is submitted,
          // Apple refuses every tester assignment to that group with
          //   409 STATE_ERROR "Tester(s) cannot be assigned"
          //   "The request cannot be fulfilled because of the state of
          //    another resource."
          // and the "other resource" is the build now sitting in review.
          //
          // Observed for real on 2026-08-08 (run 31262637802, build 36):
          // the submission succeeded, then BOTH tester calls 409'd, so the
          // review clock started with nobody able to receive the build. The
          // driver this whole release was for could not be added at all,
          // and the only remedy was to wait out the review and re-run.
          // Submitting is the irreversible step, so it goes last.
          for (let i = 0; i < emails.length; i++) {
            const email = emails[i];
            const firstName = names[i] || email.split("@")[0];
            const r = await api("POST", `/v1/betaTesters`, {
              data: { type: "betaTesters",
                attributes: { email, firstName },
                relationships: { betaGroups: { data: [{ type: "betaGroups", id: group.id }] } } },
            }, ["ALREADY_EXISTS", "STATE_ERROR"]);
            if (r.status === 201) {
              console.log(`${email}: INVITED`);
              continue;
            }
            // 409 STATE_ERROR: a tester record for this email already
            // exists on the app (e.g. from an old failed internal-invite
            // attempt). Find it and attach it to the group instead — that
            // sends the invite for this group.
            const found = await api(
              "GET",
              `/v1/betaTesters?filter[email]=${encodeURIComponent(email)}&filter[apps]=${APP_ID}&limit=2`,
            );
            const existing = (found.body.data ?? [])[0];
            if (!existing) {
              console.error(`::error::${email}: cannot create AND no existing tester found`);
              process.exit(1);
            }
            await api("POST", `/v1/betaGroups/${group.id}/relationships/betaTesters`, {
              data: [{ type: "betaTesters", id: existing.id }],
            }, ["ALREADY_EXISTS"]);
            console.log(`${email}: existing tester attached to group (invite sent)`);
          }

          // 5. Submit for Beta App Review, LAST (see the ordering note in
          //    step 4). A duplicate submission error means it is already
          //    in, or through, review.
          const sub = await api("POST", `/v1/betaAppReviewSubmissions`, {
            data: { type: "betaAppReviewSubmissions",
              relationships: { build: { data: { type: "builds", id: build.id } } } },
          }, ["ALREADY_EXISTS", "STATE_ERROR", "DUPLICATE", "INVALID_QC_STATE"]);
          // INVALID_QC_STATE on re-submit = the build is already in (or
          // through) beta review — exactly the resumable case.
          console.log(`Beta review: ${sub.status === 201 ? "submitted" : "already submitted/reviewed"}`);

          console.log("");
          console.log("Done. Testers get the invite email now; the build installs once Beta App Review clears.");
          SCRIPT
          node /tmp/invite.mjs
