name: Set up Playwright Chromium
description: >-
  Restore Chromium from cache and install the apt-level dependencies. Shared
  by every job in ci.yml that runs Playwright, so the four cannot drift apart.

# WHY THIS EXISTS
#
# On 2026-08-15 `npx playwright install --with-deps chromium` stalled twice
# within half an hour on different jobs (run 31908026625 job 95068762282,
# run 31909367157 job 95072027793). Each stall ate the job's full
# `timeout-minutes: 15` and was cancelled mid-download, so the actual test
# step never ran. Both passed on re-run in under five minutes.
#
# That failure mode is worse than a slow build: a cancelled job renders as a
# red check indistinguishable from a real regression, which teaches people to
# re-run red checks without reading them. On a repo where CI is the gate on
# IRS-deductible tax math, that habit is the actual damage.
#
# It was NOT concurrency between the parallel Playwright jobs. In both
# incidents the two sibling jobs downloaded Chromium successfully during the
# very window the third was stalled — a single hung connection to
# cdn.playwright.dev, not contention. So the jobs keep their own installs;
# caching is what takes that CDN off the hot path after the first run.

runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      # Key the cache on the version in package-lock.json, NOT on a hash of
      # the lockfile — an unrelated dependency bump would otherwise evict a
      # perfectly good browser build.
      #
      # playwright-core is the package that pins the browser revision.
      # @playwright/test and @playwright/experimental-ct-react both resolve
      # to a single playwright-core here, so one key covers every job. If a
      # future change ever splits them across two versions this reads the
      # wrong one, so it fails loudly (exit 1) rather than silently caching
      # a mismatched build.
      id: version
      shell: bash
      run: |
        version="$(node -p "require('$GITHUB_WORKSPACE/package-lock.json').packages['node_modules/playwright-core'].version")"
        echo "Playwright (playwright-core): $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      # ~/.cache/ms-playwright holds chromium-<rev>, chromium_headless_shell-<rev>
      # and ffmpeg-<rev> — the ~170MB of CDN download that hung. All jobs share
      # one key, so they share one entry. On a cold cache they all miss and all
      # try to save it; the losers log a benign "cache entry already exists".
      #
      # Cache scope note: an entry written on a branch is visible to that
      # branch only. PRs can read the base branch's entry, so the first run
      # on main after this merges is what populates the shared one.
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.version.outputs.version }}

    - name: Install Chromium and system dependencies
      shell: bash
      # Deliberately unconditional rather than branched on a cache hit, for
      # two reasons.
      #
      # 1. `playwright install` is already cache-aware: it skips any browser
      #    revision already present in ~/.cache/ms-playwright. Skipping the
      #    command on a hit would buy nothing except a failure mode — a
      #    partially-saved cache would then never be repaired, and every run
      #    would fail identically until the key changed. Running it always
      #    means a bad cache self-heals on the next run.
      #
      # 2. The apt half is NOT cacheable and must run every time. On
      #    ubuntu-24.04 every shared library Chromium links against
      #    (libasound2t64, libatk1.0-0t64, libcairo2, libcups2t64, libdrm2,
      #    ...) is already on the image; what `--with-deps` actually installs
      #    is nine FONT packages — fonts-freefont-ttf, fonts-unifont,
      #    fonts-ipafont-gothic, fonts-wqy-zenhei, fonts-tlwg-loma-otf,
      #    xfonts-{encodings,utils,cyrillic,scalable}. Those live in /usr,
      #    never in the cache, and the committed *-linux.png baselines were
      #    rendered with them present. Dropping them would shift glyph
      #    fallback underneath a pixel-exact diff and turn the visual and ct
      #    jobs red for reasons unrelated to any UI change — trading one
      #    class of false red check for another.
      #
      # Net effect: ~13s of apt every run, and the ~12s browser download
      # (the part that actually hung) only when the version changes.
      #
      # `timeout` rather than the step's `timeout-minutes:` because composite
      # action steps do not support that key. It is not ignored — the runner
      # rejects the manifest outright ("Unexpected value 'timeout-minutes'")
      # and every job fails before it starts; verified in run 31910629275.
      # A stall now fails at 5 min naming this step (exit 124), instead of
      # consuming the job's whole 15 and presenting as a test failure.
      run: timeout 300 npx playwright install --with-deps chromium
