<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Taxottic">
  <!-- Transparent foreground for the Android adaptive icon. The mark
       is scaled into the ~66% safe zone (centered on 256,256) so the
       OS circular/squircle mask never clips the glyph. The navy
       background is supplied by --iconBackgroundColor (#121A2A). -->
  <g transform="translate(256 256) scale(0.66) translate(-256 -256)">
    <text x="256" y="368"
          text-anchor="middle"
          font-family="Fraunces, 'Hoefler Text', 'Garamond', 'Times New Roman', serif"
          font-weight="500"
          font-size="380"
          letter-spacing="-2"
          fill="#fbf7e9">t</text>
    <g fill="#c4a25d">
      <circle cx="216" cy="412" r="3.5"/>
      <rect x="225" y="410" width="62" height="4" rx="2"/>
      <circle cx="296" cy="412" r="3.5"/>
    </g>
  </g>
</svg>
